name: AM3352 placement benchmark
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # The outer-layer control needs a longer bounded search. Require native
      # DRC, complete-copper self-short auditing, and full pad-to-pad length
      # matching for all ten completed routes.
      - run: ./benchmark.sh --timeout-seconds 1800 --require-all-solved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am3352-placement-benchmark-results
          path: benchmark-results.json
