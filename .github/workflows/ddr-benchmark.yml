name: AM3352 placement benchmark
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # Require native DRC, complete-copper self-short auditing, and full
      # pad-to-pad length matching for all eleven completed routes.
      # The matched single-inner-carrier search needs a longer bounded budget.
      - run: ./benchmark.sh --timeout-seconds 3600 --require-all-solved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am3352-placement-benchmark-results
          path: benchmark-results.json
