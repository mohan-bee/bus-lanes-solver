name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Full-board 11/11 acceptance runs separately on Blacksmith for every PR.
      - run: bun test --timeout 120000
